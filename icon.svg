<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="300px" height="300px" viewBox="0 0 100 100">

  <!-- Fond : #0f1216, même couleur que fletchlog/icon.svg (fond plein
       bord, coins arrondis, même rapport rx/largeur, 112/512). -->
  <rect width="100" height="100" rx="21.875" fill="#0f1216"/>

  <!-- ===== Calque NOIR (tous les bras, dessiné en premier) ===== -->
  <g stroke="#000" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(0 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" stroke-width="5"/>
      <path d="M 42 82 L 50 94 L 58 82" stroke-width="5"/>
      <g transform="translate(50,26) scale(0.85) translate(-44.843,-39.079)">
        <path stroke-width="4.5"
          d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
          style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
      </g>
    </g>
    <g transform="rotate(120 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" stroke-width="5"/>
      <path d="M 42 82 L 50 94 L 58 82" stroke-width="5"/>
      <g transform="translate(50,26) scale(0.85) translate(-44.843,-39.079)">
        <path stroke-width="4.5"
          d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
          style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
      </g>
    </g>
    <g transform="rotate(240 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" stroke-width="5"/>
      <path d="M 42 82 L 50 94 L 58 82" stroke-width="5"/>
      <g transform="translate(50,26) scale(0.85) translate(-44.843,-39.079)">
        <path stroke-width="4.5"
          d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
          style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
      </g>
    </g>
  </g>

  <!-- ===== Calque OR (tous les bras, dessiné après -> recouvre le noir aux jonctions) ===== -->
  <g stroke="#d1a13d" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(0 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" stroke-width="3"/>
      <path d="M 42 82 L 50 94 L 58 82" stroke-width="3"/>
      <g transform="translate(50,26) scale(0.85) translate(-44.843,-39.079)">
        <path stroke-width="3"
          d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
          style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
      </g>
    </g>
    <g transform="rotate(120 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" stroke-width="3"/>
      <path d="M 42 82 L 50 94 L 58 82" stroke-width="3"/>
      <g transform="translate(50,26) scale(0.85) translate(-44.843,-39.079)">
        <path stroke-width="3"
          d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
          style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
      </g>
    </g>
    <g transform="rotate(240 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" stroke-width="3"/>
      <path d="M 42 82 L 50 94 L 58 82" stroke-width="3"/>
      <g transform="translate(50,26) scale(0.85) translate(-44.843,-39.079)">
        <path stroke-width="3"
          d="M 62.853 39.187 L 34.723 39.187 L 25.508 29.226 L 51.190 29.365 L 56.032 39.187 L 51.190 49.009 L 25.508 49.148 L 34.723 39.187 M 39.680 29.831 L 46.066 39.187 L 39.680 48.543"
          style="transform-box: fill-box; transform-origin: 50% 50%;" transform="matrix(0, 1, -1, 0, 0.662491, -0.108498)"/>
      </g>
    </g>
  </g>

  <!-- cible dessinée en dernier, fond noir opaque pour ne plus voir
       les fûts par transparence à l'intérieur -->
  <circle cx="50" cy="50" r="9" fill="#000"/>
  <circle cx="50" cy="50" r="9" fill="none" stroke="#000" stroke-width="4"/>
  <g fill="none" stroke="#d1a13d" stroke-width="2">
    <circle cx="50" cy="50" r="9"/>
    <circle cx="50" cy="50" r="3"/>
  </g>

</svg>
