<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FletchGames</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1216">
<!-- Safari ne lit pas manifest.json pour "Ajouter à l'écran d'accueil"
     (même piège que fletchlog#18) -- posé dès le départ ici plutôt que
     rattrapé après coup. -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FletchGames">
<link rel="stylesheet" href="theme.css">
<style>
  /* Page d'accueil -- grand hero (retour utilisateur, 2026-08-24 :
     la version compacte réduisait trop le logo/titre) suivi de deux
     carrousels (jeux, puis historique/stats) et d'une carte Aide. */
  body { display: flex; flex-direction: column; align-items: center; padding: 5.5rem 1.25rem 2rem; min-height: 100vh; box-sizing: border-box; }
  .accueil { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; }

  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 560px; }
  .hero img.mark { height: 186px; width: 186px; margin-bottom: 1.1rem; }
  /* display:block -- sans ça, le h1 générique de theme.css (display:flex;
     gap:0.6rem, pensé pour un autre patron icône+titre) casse le
     centrage et ajoute un espace parasite entre les deux spans du
     wordmark (même piège que fletchapps#6/fletchlog, voir leurs
     CLAUDE.md respectifs). */
  .hero h1 { display: block; font-size: 2.25rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 8px; }
  .hero h1 .games { color: var(--gold); }
  .hero .tagline { color: var(--text-muted); font-size: 1.02rem; margin: 0 0 0.6rem; line-height: 1.5; }

  /* margin-top généreux avant "Les jeux" (retour utilisateur, 2026-08-24)
     -- le hero doit garder sa respiration d'origine (comme fletchlog),
     pas être comprimé par la première section qui suit juste en dessous. */
  .section-titre { align-self: flex-start; font-size: 0.95rem; font-weight: 700; color: var(--text); margin: 3rem 0 0.6rem; }
  .section-titre:first-of-type { margin-top: 2.5rem; }

  /* Carrousel -- scroll-snap natif plutôt que le patron de piste/JS
     de la lightbox de FletchLog (pensé pour du pinch-zoom photo, bien
     plus qu'il n'en faut pour de simples cartes) : plus simple, geste
     tactile natif du navigateur, pas de JS de glissement à maintenir. */
  .carrousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 4px 10px; width: 100%; scrollbar-width: none; }
  .carrousel::-webkit-scrollbar { display: none; }
  /* Cadre or sur les cartes du carrousel des jeux (retour utilisateur,
     2026-08-25) -- seulement celles-ci, pas celles de l'historique :
     ce sont celles qu'on touche pour lancer une partie, méritent de
     ressortir un peu plus sur la page. */
  #carrousel-jeux .carrousel-carte { border-color: var(--gold); }
  .carrousel-carte {
    scroll-snap-align: start; flex: 0 0 84%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem;
    text-align: left; font-family: inherit; color: var(--text); cursor: default; display: flex; flex-direction: column; gap: 0.4rem;
  }
  button.carrousel-carte { cursor: pointer; }
  button.carrousel-carte:active { border-color: var(--gold); }
  .carrousel-carte h3 { margin: 0; font-size: 1.05rem; }
  .carrousel-carte .jeu-presentation { margin: 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; }
  .carrousel-carte .jeu-historique-mini { margin: 0; font-size: 0.78rem; color: var(--text-faint); }

  .historique-carte .podium { display: flex; flex-direction: column; gap: 4px; margin: 0.2rem 0; }
  .historique-carte .podium-ligne { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
  .historique-carte .podium-rang { width: 1.4em; color: var(--text-faint); font-weight: 700; }
  .historique-carte .podium-nom { flex: 1; color: var(--text); }
  .historique-carte .podium-victoires { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .historique-carte .stat-ligne { font-size: 0.8rem; color: var(--text-muted); margin: 0; }
  .historique-carte .stat-ligne strong { color: var(--gold); }

  .carte-aide {
    width: 100%; margin-top: 1.6rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.9rem 1rem; text-decoration: none; color: var(--text); font-weight: 600; font-size: 0.92rem;
  }
  .carte-aide:hover { border-color: var(--gold); color: var(--gold); }

  /* Jeu au hasard -- fait défiler rapidement puis s'arrête sur un jeu
     tiré au sort (voir tirerJeuAuHasard() dans accueil.js). Discret
     (fond transparent, pas .btn-primary) : un coup de pouce, pas
     l'action principale de la page. */
  .bouton-jeu-hasard {
    display: block; width: 100%; margin: 0.6rem 0 0; background: transparent;
    border: 1px dashed var(--border); border-radius: var(--radius); padding: 0.6rem 1rem;
    color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-align: center;
  }
  .bouton-jeu-hasard:active { border-color: var(--gold); color: var(--gold); }

  footer { margin-top: 2.5rem; color: var(--text-faint); font-size: 0.78rem; text-align: center; }
  footer a { color: var(--text-muted); }
</style>
</head>
<body>

  <div class="top-controls">
    <div class="theme-toggle">
      <button class="theme-btn" data-theme="system" onclick="setTheme('system')" data-i18n-aria-label="themeSystemLabel" aria-label="Thème système">◐</button>
      <button class="theme-btn" data-theme="light" onclick="setTheme('light')" data-i18n-aria-label="themeLightLabel" aria-label="Thème clair">☀</button>
      <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" data-i18n-aria-label="themeDarkLabel" aria-label="Thème sombre">☾</button>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn" id="lang-fr-btn" onclick="setLanguage('fr')">FR</button>
      <button class="lang-btn" id="lang-en-btn" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <div class="accueil">
    <div class="hero">
      <img class="mark" src="icon.svg" alt="">
      <h1>Fletch<span class="games">Games</span></h1>
      <p class="tagline" data-i18n="homeTagline">Mini-jeux d'entraînement au tir à l'arc, sur un moteur de score commun.</p>
    </div>

    <h2 class="section-titre" data-i18n="accueilJeuxTitre">Les jeux</h2>
    <div class="carrousel" id="carrousel-jeux"></div>
    <button type="button" class="bouton-jeu-hasard" id="bouton-jeu-hasard" data-i18n="accueilJeuHasard">🎲 Jeu au hasard</button>

    <h2 class="section-titre" data-i18n="accueilHistoriqueTitre">Historique et statistiques</h2>
    <div class="carrousel" id="carrousel-historique"></div>

    <a class="carte-aide" href="aide.html" data-i18n="aideLien">Aide</a>
  </div>

  <footer>
    <span data-i18n="siteFooterCredit">Développé pour les Archers Libres de Fontaine-le-Port ·</span>
    <a href="https://github.com/MrFanghoDev" target="_blank" rel="noopener">@MrFanghoDev</a>
    · <a href="https://github.com/MrFanghoDev/fletchgames/blob/master/LICENSE" data-i18n="siteFooterLicense" target="_blank" rel="noopener">Licence GPLv3</a>
    <br>
    <a href="https://github.com/MrFanghoDev/fletchgames" data-i18n="homeFooterDevLink">Dépôt GitHub</a>
    · <span id="footer-version"></span>
  </footer>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="sw-register.js"></script>
<script src="version.js"></script>
<script src="storage.js"></script>
<script type="module" src="accueil.js"></script>
<script>
  document.getElementById("footer-version").textContent = FLETCHGAMES_VERSION;
</script>
</body>
</html>
