name: Publier sur GitHub Pages

# Même patron que fletchlog/.github/workflows/pages.yml -- posé dès le
# départ ici plutôt que rattrapé après coup (voir fletchlog#21, migré
# depuis un déploiement legacy sur chaque push). Aucune étape de build
# ici non plus (tout le dépôt EST le site public) : un simple checkout
# + upload-pages-artifact + deploy-pages suffit.
#
# Déclenché UNIQUEMENT par un tag de release (ou un lancement manuel) --
# jamais sur un simple push de branche.
#
# Numéro de version affiché dans le footer (voir version.js) réécrit
# depuis le nom du tag, sur l'artefact déployé seulement -- jamais
# commité en retour, même patron que fletchlog/.github/workflows/pages.yml.
#
# Configuration ponctuelle nécessaire (une seule fois, sur GitHub, à la
# main) : Settings -> Pages -> Source: "GitHub Actions". Posée ici dès
# la création du dépôt Pages plutôt qu'après coup.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour le numéro de version affiché (depuis le tag)
        # Seulement sur un vrai tag -- github.ref_name vaut le nom de la
        # branche pour un workflow_dispatch manuel, pas une version.
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/const FLETCHGAMES_VERSION = \".*\";/const FLETCHGAMES_VERSION = \"${{ github.ref_name }}\";/" version.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
